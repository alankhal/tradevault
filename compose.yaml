
services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: tradevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRADEVAULT_POSTGRES_PASSWORD:?Set database password in .env}

    volumes:
      - tradevault_pgdata:/var/lib/postgresql/data
      - ./migrations/0001_create_trades.sql:/docker-entrypoint-initdb.d/0001_create_trades.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradevault"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    build:
      context: .
    image: tradevault-api:latest

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      TRADEVAULT_DB_CONNECTION: "dbname=tradevault user=postgres password=${TRADEVAULT_POSTGRES_PASSWORD:?Set password in .env} host=db port=5432"

    depends_on:
      db:
        condition: service_healthy

volumes:
  tradevault_pgdata:
